name: agro_ai
description: "Agro AI — ёрдамчии рақамии деҳқони тоҷик: қитъаҳо, обёрӣ, скани растанӣ бо AI, дафтари хоҷагӣ ва донишнома."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  tflite_flutter: any
  image: any
  sqflite: any
  path: any
  timezone: ^0.11.2

dev_dependencies:
  flutter_lints: ^6.0.0
  sqflite_common_ffi: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    # Модели худӣ: дар offline асосӣ, дар online — захиравӣ (бе калид ё бе интернет).
    - assets/models/
