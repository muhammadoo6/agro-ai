name: compare-models

# Сравнение двух моделей из релизов на реальных фото, которых не было в обучении.
on:
  workflow_dispatch:
    inputs:
      old:
        description: 'Тег старой модели'
        default: 'model-run19'
      new:
        description: 'Тег новой модели'
        default: 'model-run20'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "tensorflow-cpu>=2.16,<2.21" "numpy<2.2" pillow
      - name: Download models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.old }}" -D old
          gh release download "${{ inputs.new }}" -D new
      - name: Compare
        working-directory: tools/train
        run: python -u compare.py ../../old/plant_disease.tflite ../../old/labels.json ../../new/plant_disease.tflite ../../new/labels.json
      - uses: actions/upload-artifact@v4
        with:
          name: compare
          path: tools/train/compare.json
