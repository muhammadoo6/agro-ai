name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # Як маротиба: сохтани android/ ва ios/ ва илова кардани китобхонаҳо.
      - name: Scaffold platforms (first run only)
        id: scaffold
        if: ${{ hashFiles('android/app/build.gradle.kts', 'android/app/build.gradle') == '' }}
        run: |
          echo "done=true" >> "$GITHUB_OUTPUT"
          flutter create --project-name agro_ai --org tj.agroai --platforms android,ios .
          flutter pub add http image_picker path_provider intl flutter_local_notifications timezone share_plus file_picker
          flutter pub add dev:flutter_lints
          git status --short
          mkdir -p scaffold
          cp -r android ios pubspec.yaml pubspec.lock analysis_options.yaml scaffold/
          [ -f .metadata ] && cp .metadata scaffold/ || true

      - name: Upload scaffold
        if: ${{ steps.scaffold.outputs.done == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: scaffold
          path: scaffold/
          include-hidden-files: true

      - name: Remove scaffold copy
        if: ${{ steps.scaffold.outputs.done == 'true' }}
        run: rm -rf scaffold

      - run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test

      - name: Screenshots of all screens (tg/ru)
        id: shots
        continue-on-error: true
        run: flutter test --update-goldens screenshot_test/

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screenshots
          path: screenshot_test/screens/
          if-no-files-found: ignore

      # Калиди имзо аз GitHub secrets (агар набошад — имзои debug).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key, using debug signing"; exit 0; fi
          mkdir -p android/keys
          echo "$KEYSTORE_BASE64" | base64 -d > android/keys/upload-keystore.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=../keys/upload-keystore.p12"
            echo "storeType=pkcs12"
          } > android/key.properties

      - name: Build APK (online + offline)
        run: |
          flutter build apk --release --split-per-abi --flavor online
          flutter build apk --release --split-per-abi --flavor offline
          ls -la build/app/outputs/flutter-apk/

      - name: Build App Bundles (Google Play)
        run: |
          flutter build appbundle --release --flavor online
          flutter build appbundle --release --flavor offline

      - name: Verify signature and permissions
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-online-release.apk | grep -E "DN|SHA-256"
          echo "--- online permissions"; "$BT/aapt2" dump permissions build/app/outputs/flutter-apk/app-arm64-v8a-online-release.apk
          echo "--- offline permissions"; "$BT/aapt2" dump permissions build/app/outputs/flutter-apk/app-arm64-v8a-offline-release.apk
          echo "--- offline model in apk"; unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-offline-release.apk | grep -E "models/|libtensorflowlite" || true
          echo "--- online has no model"; unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-online-release.apk | grep -c "models/plant" || true

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: agro-ai-online-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-online-release.apk

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: agro-ai-offline-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-offline-release.apk

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: agro-ai-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-*-release.apk

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: agro-ai-aab
          path: build/app/outputs/bundle/*/*.aab

      - name: Fail if analyze or tests failed
        if: ${{ steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure' }}
        run: |
          echo "analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }}"
          exit 1
