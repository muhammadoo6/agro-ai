name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # Як маротиба: сохтани android/ ва ios/ ва илова кардани китобхонаҳо.
      - name: Scaffold platforms (first run only)
        id: scaffold
        if: ${{ hashFiles('android/app/build.gradle.kts', 'android/app/build.gradle') == '' }}
        run: |
          echo "done=true" >> "$GITHUB_OUTPUT"
          flutter create --project-name agro_ai --org tj.agroai --platforms android,ios .
          flutter pub add http image_picker path_provider intl flutter_local_notifications timezone share_plus file_picker
          flutter pub add dev:flutter_lints
          git status --short
          mkdir -p scaffold
          cp -r android ios pubspec.yaml pubspec.lock analysis_options.yaml scaffold/
          [ -f .metadata ] && cp .metadata scaffold/ || true

      - name: Upload scaffold
        if: ${{ steps.scaffold.outputs.done == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scaffold
          path: scaffold/
          include-hidden-files: true

      - name: Remove scaffold copy
        if: ${{ steps.scaffold.outputs.done == 'true' }}
        run: rm -rf scaffold

      - run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test

      # Калиди имзо аз GitHub secrets (агар набошад — имзои debug).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key, using debug signing"; exit 0; fi
          mkdir -p android/keys
          echo "$KEYSTORE_BASE64" | base64 -d > android/keys/upload-keystore.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=../keys/upload-keystore.p12"
            echo "storeType=pkcs12"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle (Google Play)
        run: flutter build appbundle --release

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E "DN|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: agro-ai-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Барои аксари телефонҳои муосир (64-бит)
      - uses: actions/upload-artifact@v4
        with:
          name: agro-ai-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      # Барои телефонҳои кӯҳнаи 32-бита
      - uses: actions/upload-artifact@v4
        with:
          name: agro-ai-armv7
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Fail if analyze or tests failed
        if: ${{ steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure' }}
        run: |
          echo "analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }}"
          exit 1
