name: train-model

# Обучение офлайн-модели (запускается вручную).
on:
  workflow_dispatch:
    inputs:
      epochs_head:
        description: 'Эпохи (только голова)'
        default: '4'
      epochs_fine:
        description: 'Эпохи (дообучение)'
        default: '3'
      limit:
        description: 'Пробный прогон: сколько фото (0 = все)'
        default: '0'
      fine_layers:
        description: 'Сколько верхних слоёв дообучать'
        default: '100'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install "tensorflow-cpu>=2.16,<2.21" "tensorflow-datasets>=4.9" "numpy<2.2" importlib_resources pyarrow pillow

      - name: Install 7-Zip (RAR)
        run: sudo apt-get update -qq && (sudo apt-get install -y -qq 7zip || sudo apt-get install -y -qq p7zip-full p7zip-rar) && 7z i | head -3

      - name: Train
        env:
          OUT_DIR: out
          EPOCHS_HEAD: ${{ inputs.epochs_head }}
          EPOCHS_FINE: ${{ inputs.epochs_fine }}
          LIMIT: ${{ inputs.limit }}
          FINE_LAYERS: ${{ inputs.fine_layers }}
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          (while true; do echo "MON $(date +%T) mem=$(free -m | awk '/Mem/{print $3"/"$2}') swap=$(free -m | awk '/Swap/{print $3"/"$2}') disk=$(df -h / | awk 'NR==2{print $3"/"$2}')"; sleep 20; done) &
          python -u tools/train/train.py

      # Release не занимает квоту артефактов — модель не потеряется.
      - name: Save model as release
        if: inputs.limit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "model-run${{ github.run_number }}"             out/plant_disease.tflite out/labels.json out/report.json             --prerelease --title "Model (run ${{ github.run_number }})" --notes "Offline model"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 30
          name: plant-model
          path: out/
